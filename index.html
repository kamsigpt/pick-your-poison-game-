<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9ec" />
  <meta name="description" content="Two choices. One decision. Endless arguments. Pick a side and see what your friends think." />
  <title>PICK A SIDE — two choices, endless arguments</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="#play" data-view="home" aria-label="PICK A SIDE home">
        <span class="wordmark-top">PICK</span><span class="wordmark-bottom">A SIDE<span class="wordmark-dot">.</span></span>
      </a>
      <div class="header-right">
        <div class="xp-chip" title="Your locally saved experience points"><span class="xp-spark">✳</span><b id="headerXp">0</b><small>XP</small></div>
        <button class="account-button" id="accountButton">LOG IN / SIGN UP <span>↗</span></button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer"><span>© 2026 PICK A SIDE</span><span>TWO CHOICES. ONE DECISION. <b>NO PEACE.</b></span><button id="customButton">MAKE YOUR OWN ↗</button></footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="questions.js"></script>
  <script src="additional-questions.js"></script>
  <script src="app.js"></script>

</html>
